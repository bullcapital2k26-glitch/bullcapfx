<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Bearish candle (left) -->
  <rect x="7" y="18" width="8" height="14" rx="1.5" fill="#4D9FFF"/>
  <line x1="11" y1="12" x2="11" y2="18" stroke="#4D9FFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="11" y1="32" x2="11" y2="38" stroke="#4D9FFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bullish candle (center) -->
  <rect x="20" y="10" width="8" height="18" rx="1.5" fill="#1A7AFF"/>
  <line x1="24" y1="5"  x2="24" y2="10" stroke="#1A7AFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="24" y1="28" x2="24" y2="34" stroke="#1A7AFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bullish candle (right) -->
  <rect x="33" y="14" width="8" height="16" rx="1.5" fill="#0055FF"/>
  <line x1="37" y1="8"  x2="37" y2="14" stroke="#0055FF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37" y1="30" x2="37" y2="36" stroke="#0055FF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
